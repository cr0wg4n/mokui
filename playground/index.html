<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>mokui playground</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; grid-template-rows: auto auto 1fr 200px; height: 100vh; }
      header { grid-column: 1 / 3; display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid #ccc; font-size: 13px; }
      header input[type=range] { width: 240px; }
      #src { border: 0; border-right: 1px solid #ccc; padding: 16px; font: 13px/1.5 monospace; resize: none; outline: none; grid-row: 3 / 5; }
      #out { padding: 16px; overflow: auto; background: #fafafa; }
      #err { color: #b00; font: 13px monospace; white-space: pre-wrap; }
      #outline { margin: 0; padding: 12px 16px; overflow: auto; border-top: 1px solid #ccc; font: 12px/1.4 monospace; background: #fff; }
      #cheat { display: none; }
      #themepanel { grid-column: 1 / 3; border-bottom: 1px solid #ccc; font-size: 13px; background: #fafafa; }
      #themepanel summary { cursor: pointer; padding: 6px 16px; font-weight: 600; }
      #themebody { display: grid; grid-template-columns: auto 1fr; gap: 12px 24px; padding: 4px 16px 12px; align-items: start; }
      #themebody .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
      .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #bbb; cursor: pointer; padding: 0; }
      .sw[aria-pressed=true] { box-shadow: 0 0 0 2px #18181b; }
      .sw.none { background: linear-gradient(135deg, #fff 45%, #d4d4d8 45% 55%, #fff 55%); }
      #themejson { width: 100%; height: 150px; font: 12px/1.4 monospace; box-sizing: border-box; resize: vertical; }
      #themeerr { color: #b00; font: 12px monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <label>ejemplo <select id="example"></select></label>
      <label>container width <input id="w" type="range" min="280" max="1200" value="860" /> <b id="wv">860</b>px</label>
      <span style="color:#777">click things: Invite, Actions, Menu, tabs. Breakpoints: sm 480 / md 768 / lg 1024 (container width)</span>
    </header>
    <details id="themepanel">
      <summary>Theme editor <span style="font-weight:400;color:#777">(base, accent, radius, font; the JSON is a theme file you can save and load)</span></summary>
      <div id="themebody">
        <div>
          <div class="row"><label>base <select id="tbase"></select></label><label>radius <select id="tradius"></select></label><label>font <select id="tfont"></select></label></div>
          <div class="row" style="margin-top:10px"><span>accent</span><span id="swatches" class="row" style="gap:6px"></span><label>custom <input id="tcolor" type="color" value="#4f46e5" /></label></div>
          <div class="row" style="margin-top:10px"><label><input id="tneutrals" type="checkbox" /> tint surfaces and text with the accent's hue (themeFromColor)</label></div>
          <div class="row" style="margin-top:10px"><button id="tcopyjson">Copy JSON</button><button id="tcopycss">Copy CSS</button><button id="treset">Reset</button></div>
        </div>
        <div><textarea id="themejson" spellcheck="false"></textarea><div id="themeerr"></div></div>
      </div>
    </details>
    <textarea id="src" spellcheck="false"></textarea>
    <div id="out"><div id="err"></div><div id="app" style="margin:0"></div></div>
    <pre id="outline"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
